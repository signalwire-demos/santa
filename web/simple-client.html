<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalWire Simple Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .status.connecting {
            background: #fef3c7;
            color: #92400e;
        }

        .status.connected {
            background: #d1fae5;
            color: #065f46;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
        }

        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .video-wrapper {
            position: relative;
            background: #1f2937;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Style the injected remote video element */
        #remoteVideoWrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            background: #000 !important;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1;
        }

        .members-list {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .members-list h3 {
            margin-bottom: 10px;
            color: #374151;
        }

        .member {
            padding: 8px;
            background: white;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-status {
            display: flex;
            gap: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .audio-on { background: #10b981; }
        .audio-off { background: #ef4444; }
        .video-on { background: #10b981; }
        .video-off { background: #ef4444; }

        .events-viewer {
            margin-top: 20px;
            padding: 15px;
            background: #1f2937;
            border-radius: 10px;
            color: #f3f4f6;
        }

        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #374151;
        }

        .events-title {
            font-size: 14px;
            font-weight: 600;
            color: #10b981;
        }

        .events-clear {
            background: #374151;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .events-clear:hover {
            background: #4b5563;
        }

        .events-container {
            max-height: 300px;
            overflow-y: auto;
            background: #111827;
            border-radius: 5px;
            padding: 10px;
        }

        .event-entry {
            margin-bottom: 10px;
            padding: 8px;
            background: #1f2937;
            border-radius: 4px;
            border-left: 3px solid #374151;
            font-size: 12px;
        }

        .event-entry.user-event {
            border-left-color: #10b981;
            background: #064e3b;
        }

        .event-time {
            color: #9ca3af;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .event-data {
            color: #60a5fa;
            font-family: monospace;
            font-size: 11px;
            margin-top: 4px;
            padding: 4px;
            background: #0f172a;
            border-radius: 3px;
            overflow-x: auto;
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SignalWire Video Room</h1>

        <div id="status" class="status disconnected">
            Disconnected
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn-primary">Connect</button>
            <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
            <button id="toggleAudioBtn" class="btn-secondary" disabled>Mute Audio</button>
            <button id="toggleVideoBtn" class="btn-secondary" disabled>Disable Video</button>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <div class="video-label">Local Video</div>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-wrapper" id="remoteVideoWrapper">
                <div class="video-label">Remote Video</div>
                <!-- remote video element is injected here -->
            </div>
        </div>

        <div class="members-list" id="membersList" style="display: none;">
            <h3>Room Members</h3>
            <div id="membersContainer"></div>
        </div>

        <div class="events-viewer">
            <div class="events-header">
                <span class="events-title">📡 User Events</span>
                <button class="events-clear" onclick="clearEvents()">Clear</button>
            </div>
            <div class="events-container" id="eventsContainer">
                <div style="color: #6b7280; text-align: center; padding: 20px;">
                    No events received yet...
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.signalwire.com/@signalwire/js@4.0.0-rc.0"></script>
    <script type="text/javascript">
        // Token + destination are fetched dynamically from /get_token so this
        // client works against whatever agent the server has registered.
        let currentDestination = null;

        // State
        let client = null;
        let call = null;
        let subscriptions = [];
        let currentLocalStream = null;
        let remoteVideoEl = null;
        let lastRemoteSig = '';
        let teardownDone = false;
        let audioEnabled = true;
        let videoEnabled = true;

        // DOM Elements
        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const localVideo = document.getElementById('localVideo');
        const membersList = document.getElementById('membersList');
        const membersContainer = document.getElementById('membersContainer');
        const eventsContainer = document.getElementById('eventsContainer');

        // Update UI Status
        function updateStatus(status, message) {
            statusEl.className = `status ${status}`;
            statusEl.textContent = message;
        }

        // --- v4 helpers -------------------------------------------------

        // Track an RxJS subscription for later teardown
        function track(sub) {
            if (sub) subscriptions.push(sub);
            return sub;
        }

        // Stable signature for a stream's track set (kind:id, sorted)
        function streamSignature(stream) {
            return stream.getTracks().map(t => t.kind + ':' + t.id).sort().join(',');
        }

        // Hardened token fetch (tolerates the FastAPI tuple-return array shape)
        async function fetchGuestToken() {
            const resp = await fetch('/get_token');
            let data = await resp.json();
            if (Array.isArray(data)) data = data[0] || {};
            if (!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
            if (!data.token || !data.address) throw new Error('Token response missing token/address');
            return data;
        }

        // Gate the dial on the client connecting (replays synchronously; never
        // errors on bad creds -> needs a timeout).
        function waitForConnected(swClient, timeoutMs) {
            return new Promise((resolve, reject) => {
                let settled = false;
                let sub = null;
                const timer = setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    if (sub) { try { sub.unsubscribe(); } catch (e) {} }
                    reject(new Error('Timed out waiting for SignalWire connection'));
                }, timeoutMs);
                sub = swClient.isConnected$.subscribe(connected => {
                    if (connected && !settled) {
                        settled = true;
                        clearTimeout(timer);
                        setTimeout(() => { if (sub) { try { sub.unsubscribe(); } catch (e) {} } }, 0);
                        resolve();
                    }
                });
            });
        }

        // Local self-preview (element is muted in markup to avoid feedback)
        function attachLocalStream(stream) {
            currentLocalStream = stream || null;
            if (localVideo.srcObject !== stream) {
                localVideo.srcObject = stream || null;
            }
        }

        // Render the remote stream into #remoteVideoWrapper. Leave it unmuted
        // (carries remote audio). Re-attach on track-set change.
        function attachRemoteStream(stream) {
            if (!stream) return;
            const container = document.getElementById('remoteVideoWrapper');
            if (!container) return;

            if (!remoteVideoEl) {
                remoteVideoEl = document.createElement('video');
                remoteVideoEl.autoplay = true;
                remoteVideoEl.playsInline = true;
                remoteVideoEl.setAttribute('playsinline', '');
                container.appendChild(remoteVideoEl);
            }

            const sig = streamSignature(stream);
            if (sig !== lastRemoteSig) {
                lastRemoteSig = sig;
                remoteVideoEl.srcObject = stream;
                remoteVideoEl.play().catch(e => console.log('Remote video play blocked:', e.message));
            }
        }

        // Event logging functions
        function logEvent(message, data = null, isUserEvent = false) {
            // Clear the placeholder if it's still there
            if (eventsContainer.innerHTML.includes('No events received yet')) {
                eventsContainer.innerHTML = '';
            }

            const entry = document.createElement('div');
            entry.className = isUserEvent ? 'event-entry user-event' : 'event-entry';

            const time = new Date().toLocaleTimeString();

            let dataStr = '';
            if (data) {
                try {
                    // Handle circular references
                    const seen = new WeakSet();
                    dataStr = JSON.stringify(data, (key, value) => {
                        if (typeof value === 'object' && value !== null) {
                            if (seen.has(value)) {
                                return '[Circular Reference]';
                            }
                            seen.add(value);
                        }
                        return value;
                    }, 2);
                } catch (e) {
                    dataStr = 'Error serializing data: ' + e.message;
                }
            }

            entry.innerHTML = `
                <div class="event-time">${time}</div>
                <div>${isUserEvent ? '🟢 USER EVENT: ' : ''}${message}</div>
                ${dataStr ? `<div class="event-data">${dataStr}</div>` : ''}
            `;

            eventsContainer.appendChild(entry);
            eventsContainer.scrollTop = eventsContainer.scrollHeight;
        }

        function clearEvents() {
            eventsContainer.innerHTML = `
                <div style="color: #6b7280; text-align: center; padding: 20px;">
                    No events received yet...
                </div>
            `;
        }

        // Handle user events (SWML user_event wraps its payload under .event)
        function handleUserEvent(params) {
            const eventData = (params && params.event) ? params.event : params;
            if (!eventData) return;
            console.log('📡 User Event Received:', eventData);
            logEvent(eventData.type || 'Unknown Event', eventData, true);
        }

        // Update Members List (defensive about the participants$ emit shape)
        function updateMembersList(participants) {
            let members = [];
            if (Array.isArray(participants)) {
                members = participants;
            } else if (participants && typeof participants === 'object') {
                members = Object.values(participants);
            }

            if (!members || members.length === 0) {
                membersList.style.display = 'none';
                return;
            }

            membersList.style.display = 'block';
            membersContainer.innerHTML = '';

            members.forEach(member => {
                const name = member.name || member.display_name || member.displayName || member.id || 'Unknown';
                const audioMuted = member.audio_muted ?? member.audioMuted ?? false;
                const videoMuted = member.video_muted ?? member.videoMuted ?? false;

                const memberDiv = document.createElement('div');
                memberDiv.className = 'member';

                const nameSpan = document.createElement('span');
                nameSpan.textContent = name;

                const statusDiv = document.createElement('div');
                statusDiv.className = 'member-status';

                const audioIndicator = document.createElement('span');
                audioIndicator.className = `status-indicator ${audioMuted ? 'audio-off' : 'audio-on'}`;
                audioIndicator.title = audioMuted ? 'Audio Off' : 'Audio On';

                const videoIndicator = document.createElement('span');
                videoIndicator.className = `status-indicator ${videoMuted ? 'video-off' : 'video-on'}`;
                videoIndicator.title = videoMuted ? 'Video Off' : 'Video On';

                statusDiv.appendChild(audioIndicator);
                statusDiv.appendChild(videoIndicator);
                memberDiv.appendChild(nameSpan);
                memberDiv.appendChild(statusDiv);
                membersContainer.appendChild(memberDiv);
            });
        }

        // UI transition once the call reaches 'connected'
        function onConnected() {
            updateStatus('connected', `Connected to: ${currentDestination}`);
            disconnectBtn.disabled = false;
            toggleAudioBtn.disabled = false;
            toggleVideoBtn.disabled = false;
        }

        // Connect to Room (v4)
        async function connect() {
            try {
                updateStatus('connecting', 'Connecting...');
                connectBtn.disabled = true;

                // Reset per-connection state
                teardownDone = false;
                subscriptions = [];
                currentLocalStream = null;
                remoteVideoEl = null;
                lastRemoteSig = '';

                const tokenData = await fetchGuestToken();
                currentDestination = tokenData.address;

                const SW = window.SignalWire;
                if (!SW || typeof SW.SignalWire !== 'function') {
                    throw new Error('SignalWire v4 SDK not loaded');
                }

                // v4: constructor auto-connects; guest SAT via StaticCredentialProvider
                client = new SW.SignalWire(new SW.StaticCredentialProvider({ token: tokenData.token }));

                track(client.errors$.subscribe(e => console.error('SDK error:', e && e.code, e && e.message)));
                track(client.warnings$.subscribe(w => console.warn('SDK warning:', w && w.code, w && w.message)));

                await waitForConnected(client, 15000);

                // Two-way room: send + receive audio and video
                call = await client.dial(currentDestination, {
                    audio: true,
                    video: true,
                    receiveAudio: true,
                    receiveVideo: true,
                    userVariables: {
                        userName: `User-${Math.floor(Math.random() * 1000)}`,
                        interface: 'simple-client-v4'
                    }
                });

                console.log('Call created:', call);

                track(call.remoteStream$.subscribe(stream => attachRemoteStream(stream)));
                track(call.localStream$.subscribe(stream => attachLocalStream(stream)));

                // Room members (if the SDK exposes them)
                if (call.participants$ && typeof call.participants$.subscribe === 'function') {
                    track(call.participants$.subscribe(p => {
                        try { updateMembersList(p); } catch (e) { /* tolerate shape changes */ }
                    }));
                }

                track(call.subscribe('user_event').subscribe(evt => {
                    const params = (evt && evt.params) ? evt.params : evt;
                    handleUserEvent(params);
                }));

                track(call.status$.subscribe({
                    next: (status) => {
                        console.log('call.status:', status);
                        if (status === 'connected') {
                            onConnected();
                        } else if (status === 'disconnected' || status === 'failed' || status === 'destroyed') {
                            updateStatus('disconnected', 'Call ended');
                            handleDisconnect();
                        }
                    },
                    complete: () => handleDisconnect()
                }));

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('disconnected', `Error: ${error.message}`);
                handleDisconnect();
            }
        }

        // Handle disconnection and cleanup (deduped; unsubscribes all)
        function handleDisconnect() {
            if (teardownDone) return;
            teardownDone = true;

            subscriptions.forEach(s => { try { s.unsubscribe(); } catch (e) {} });
            subscriptions = [];

            // Detach local video (tracks owned by the call)
            if (localVideo.srcObject) {
                localVideo.srcObject = null;
            }

            // Clear the remote video element and restore the label
            const remoteVideoContainer = document.getElementById('remoteVideoWrapper');
            if (remoteVideoContainer) {
                remoteVideoContainer.querySelectorAll('video').forEach(video => {
                    video.srcObject = null;
                    video.remove();
                });
                remoteVideoContainer.innerHTML = `
                    <div class="video-label">Remote Video</div>
                    <!-- remote video element is injected here -->
                `;
            }

            // Clean up client and call
            if (client) {
                try { client.disconnect(); } catch (e) { console.log('Client disconnect error:', e); }
                client = null;
            }
            call = null;
            currentLocalStream = null;
            remoteVideoEl = null;
            lastRemoteSig = '';

            updateStatus('disconnected', 'Disconnected');
            resetUI();
            logEvent('Session disconnected', null);
        }

        // Disconnect from Call (user initiated)
        async function disconnect() {
            try {
                if (call) {
                    await call.hangup();
                }
            } catch (error) {
                console.error('Disconnect error:', error);
            }
            handleDisconnect();
        }

        // Toggle Audio — v4 server-side self.mute()/unmute() with local fallback
        async function toggleAudio() {
            if (!call) return;
            const wantMuted = audioEnabled; // if currently enabled, we want to mute
            let ok = false;
            try {
                if (wantMuted) {
                    await call.self.mute();
                } else {
                    await call.self.unmute();
                }
                ok = true;
            } catch (e) {
                console.warn('Server mute failed, using local fallback:', e.message);
            }
            if (!ok) {
                const tracks = currentLocalStream ? currentLocalStream.getAudioTracks() : [];
                tracks.forEach(t => { t.enabled = !wantMuted; });
            }
            audioEnabled = !wantMuted;

            if (audioEnabled) {
                toggleAudioBtn.textContent = 'Mute Audio';
                toggleAudioBtn.className = 'btn-secondary';
            } else {
                toggleAudioBtn.textContent = 'Unmute Audio';
                toggleAudioBtn.className = 'btn-success';
            }
            console.log('Audio enabled:', audioEnabled);
        }

        // Toggle Video — toggle the local video track directly
        async function toggleVideo() {
            try {
                const tracks = currentLocalStream ? currentLocalStream.getVideoTracks() : [];
                if (!tracks.length) {
                    console.warn('No local video track to toggle');
                    return;
                }
                tracks.forEach(track => {
                    track.enabled = !track.enabled;
                    videoEnabled = track.enabled;
                });

                if (videoEnabled) {
                    toggleVideoBtn.textContent = 'Disable Video';
                    toggleVideoBtn.className = 'btn-secondary';
                } else {
                    toggleVideoBtn.textContent = 'Enable Video';
                    toggleVideoBtn.className = 'btn-success';
                }
                console.log('Video enabled:', videoEnabled);
            } catch (error) {
                console.error('Video toggle error:', error);
            }
        }

        // Reset UI
        function resetUI() {
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            toggleAudioBtn.disabled = true;
            toggleVideoBtn.disabled = true;
            toggleAudioBtn.textContent = 'Mute Audio';
            toggleVideoBtn.textContent = 'Disable Video';
            toggleAudioBtn.className = 'btn-secondary';
            toggleVideoBtn.className = 'btn-secondary';
            membersList.style.display = 'none';
            audioEnabled = true;
            videoEnabled = true;
        }

        // Event Listeners - wait for DOM to be ready
        window.addEventListener('DOMContentLoaded', () => {
            connectBtn.addEventListener('click', connect);
            disconnectBtn.addEventListener('click', disconnect);
            toggleAudioBtn.addEventListener('click', toggleAudio);
            toggleVideoBtn.addEventListener('click', toggleVideo);
        });

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (call) {
                disconnect();
            }
        });
    </script>
</body>
</html>
